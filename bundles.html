<script>
document.addEventListener("DOMContentLoaded", function () {

  const textureSelect = document.getElementById("texture");
  const lengthSelect = document.getElementById("length");
  const quantityInput = document.getElementById("quantity");
  const priceElement = document.getElementById("price");
  const priceNote = document.getElementById("price-note");

  /*
    IMPORTANT:
    Put the VERIFIED supplier prices for THIS collection here.
    Retail is calculated automatically at ×3.
  */

  const supplierPrices = {
    12: 15,
    14: 19,
    16: 24,
    18: 29,
    20: 34,
    22: 38,
    24: 44,
    26: 52,
    28: 58,
    30: 68,
    32: 72
  };

  /*
    Texture upcharges are RETAIL upcharges.

    Straight and Body Wave = base price.

    Premium textures:
    Kinky Straight
    Deep Wave
    Curly
    Kinky Curly
  */

  const textureUpcharges = {
    "Straight": 0,
    "Body Wave": 0,
    "Kinky Straight": 6,
    "Deep Wave": 6,
    "Curly": 6,
    "Kinky Curly": 6
  };


  function money(amount) {
    return new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD"
    }).format(amount);
  }


  function getQuantity() {

    if (!quantityInput) {
      return 1;
    }

    const quantity = Number(quantityInput.value);

    return quantity > 0 ? quantity : 1;
  }


  function calculatePrice() {

    const texture = textureSelect.value;

    const length = Number(lengthSelect.value);

    const quantity = getQuantity();

    const supplierPrice = supplierPrices[length];


    if (supplierPrice === undefined) {

      priceElement.textContent = "Price Pending";

      if (priceNote) {
        priceNote.textContent =
          texture + " • " + length + "\" • price not entered";
      }

      return;
    }


    /*
      Bundle pricing:
      supplier × 3
    */

    const baseRetailPrice = supplierPrice * 3;


    /*
      Add texture variation price
    */

    const textureUpcharge =
      textureUpcharges[texture] || 0;


    /*
      Price for ONE bundle
    */

    const pricePerBundle =
      baseRetailPrice + textureUpcharge;


    /*
      Quantity total
    */

    const total =
      pricePerBundle * quantity;


    priceElement.textContent =
      money(total);


    if (priceNote) {

      priceNote.textContent =
        texture +
        " • " +
        length +
        "\" • " +
        quantity +
        " bundle" +
        (quantity > 1 ? "s" : "") +
        " • " +
        money(pricePerBundle) +
        " each";

    }

  }


  /*
    PRICE MUST UPDATE WHEN
    ANY VARIATION CHANGES
  */

  textureSelect.addEventListener(
    "change",
    calculatePrice
  );

  lengthSelect.addEventListener(
    "change",
    calculatePrice
  );


  /*
    Works whether Quantity
    is a dropdown or number field.
  */

  if (quantityInput) {

    quantityInput.addEventListener(
      "change",
      calculatePrice
    );

    quantityInput.addEventListener(
      "input",
      calculatePrice
    );

  }


  /*
    Calculate initial price
    when page loads
  */

  calculatePrice();

});
</script>
