<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAOS Hair Collection | Big Boss Bundles</title>
  <meta name="description" content="Shop the premium luxury LAOS Hair Collection from Big Boss Bundles in straight, body wave, deep wave, curly, kinky straight and kinky curly textures.">
  <style>
    :root {
      --black:#0a0a0a; --soft:#151515; --gold:#d4a622; --teal:#00a6d6;
      --white:#fff; --cream:#f7f5ef; --muted:#bdbdbd;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:Arial,Helvetica,sans-serif;background:var(--black);color:var(--white);line-height:1.5}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    .announcement{padding:10px 5%;background:var(--teal);text-align:center;font-size:.76rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase}
    header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.97);border-bottom:2px solid var(--gold);backdrop-filter:blur(12px)}
    .header-inner{width:min(1250px,92%);margin:auto;padding:16px 0;display:flex;align-items:center;justify-content:space-between;gap:28px}
    .logo{width:180px;max-height:72px;object-fit:contain}
    nav{display:flex;align-items:center;justify-content:flex-end;gap:20px;flex-wrap:wrap;font-size:.76rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
    nav a:hover{color:var(--teal)}
    .cart-pill{padding:9px 14px;border:1px solid var(--gold);border-radius:999px;color:var(--gold)}
    .hero{min-height:630px;display:grid;grid-template-columns:1fr 1fr;align-items:center;background:radial-gradient(circle at 70% 30%,rgba(0,166,214,.18),transparent 34%),#050505;overflow:hidden}
    .hero-copy{padding:70px max(5vw,40px)}
    .eyebrow{color:var(--teal);font-size:.78rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
    h1,h2{font-family:Georgia,"Times New Roman",serif;text-transform:uppercase}
    h1{margin-top:10px;color:var(--gold);font-size:clamp(3.2rem,7vw,7.4rem);line-height:.9}
    .hero-copy p{max-width:640px;margin-top:24px;color:#ddd;font-size:1.07rem}
    .hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
    .button,.add-cart{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--gold);border-radius:999px;padding:14px 23px;background:var(--gold);color:var(--black);font-weight:900;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
    .button.secondary{background:transparent;color:var(--white);border-color:var(--white)}
    .hero-image{height:630px;width:100%;object-fit:cover;object-position:top center}
    .section{padding:82px 5%}
    .section-heading{width:min(850px,100%);margin:0 auto 42px;text-align:center}
