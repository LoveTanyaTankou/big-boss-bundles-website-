  /*

  const burmeseWigPrices = {

      40: {

    "250%": {

      18: {

      20: {

      34: {

      36: {

      38: {

        "13x6": 1182
      },

      40: {
        "4x4": 1335,
        "5x5": 1314,
        "13x4": 1329,
        "13x6": 1347
      }

    }

  };


  /* =====================================================
     TEXTURE PRICING

     Supplier specialty texture charge = $8
     Retail markup = ×3
     Customer specialty texture charge = $24
  ===================================================== */

  const specialtyTextures = [
    "Deep Wave",
    "Curly",
    "Kinky Straight",
    "Kinky Curly"
  ];

  const SPECIALTY_TEXTURE_UPCHARGE = 24;


  /* =====================================================
     CURRENT CUSTOMER SELECTION
  ===================================================== */

  function getSelectedTexture() {

    const active =
      document.querySelector(".texture-btn.active");

    return active
      ? active.dataset.texture
      : "Body Wave";
  }


  function getSelectedLength() {

    const active =
      document.querySelector(".length-btn.active");

    return active
      ? Number(active.dataset.length)
      : 28;
  }


  function getSelectedDensity() {

    const active =
      document.querySelector(".density-btn.active");

    return active
      ? active.dataset.density
      : "210%";
  }


  function getSelectedLace() {

    const active =
      document.querySelector(".lace-card.active");

    return active
      ? active.dataset.laceCard
      : "5x5";
  }


  function getQuantity() {

    const qty =
      document.getElementById("quantity");

    return qty
      ? Math.max(1, Number(qty.textContent) || 1)
      : 1;
  }


  /* =====================================================
     CALCULATE RETAIL PRICE
  ===================================================== */

  function calculateWigPrice() {

    const texture =
      getSelectedTexture();

    const length =
      getSelectedLength();

    const density =
      getSelectedDensity();

    const lace =
      getSelectedLace();


    if (
      !burmeseWigPrices[density] ||
      !burmeseWigPrices[density][length] ||
      burmeseWigPrices[density][length][lace] === undefined
    ) {

      return null;

    }


    let price =
      burmeseWigPrices[density][length][lace];


    /*
     * Specialty textures cost supplier +$8.
     * ×3 retail = +$24.
     */

    if (
      specialtyTextures.includes(texture)
    ) {

      price += SPECIALTY_TEXTURE_UPCHARGE;

    }


    return price;

  }


  /* =====================================================
     DISPLAY PRICE
  ===================================================== */

  function updateWigPrice() {

    const price =
      calculateWigPrice();

    const priceElement =
      document.getElementById("price");

    const addButton =
      document.querySelector(".add-button");


    if (!priceElement) {
      return;
    }


    if (price === null) {

      priceElement.textContent =
        "Unavailable";

      if (addButton) {

        addButton.disabled = true;

        addButton.textContent =
          "SELECTION UNAVAILABLE";

      }

      return;

    }


    priceElement.textContent =
      "$" +
      price.toLocaleString(
        "en-US",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );


    if (addButton) {

      addButton.disabled = false;

      addButton.textContent =
        "ADD TO BAG";

    }

  }


  /* =====================================================
     UPDATE PRICE WHEN CUSTOMER CHANGES OPTIONS
  ===================================================== */

  document
    .querySelectorAll(
      ".texture-btn, .length-btn, .density-btn, [data-select-lace]"
    )
    .forEach(function (button) {

      button.addEventListener(
        "click",
        function () {

          setTimeout(
            updateWigPrice,
            0
          );

        }
      );

    });


  /* =====================================================
     QUANTITY BUTTONS
  ===================================================== */

  const minus =
    document.getElementById("qty-minus");

  const plus =
    document.getElementById("qty-plus");


  if (minus) {

    minus.addEventListener(
      "click",
      function () {

        setTimeout(
          updateWigPrice,
          0
        );

      }
    );

  }


  if (plus) {

    plus.addEventListener(
      "click",
      function () {

        setTimeout(
          updateWigPrice,
          0
        );

      }
    );

  }


  /* =====================================================
     ADD WIG TO BAG
  ===================================================== */

  const addButton =
    document.querySelector(".add-button");


  if (addButton) {

    addButton.addEventListener(
      "click",
      function () {

        const price =
          calculateWigPrice();


        if (price === null) {

          alert(
            "This wig combination is currently unavailable."
          );

          return;

        }


        if (
          !window.BBBCart ||
          typeof window.BBBCart.add !== "function"
        ) {

          alert(
            "The shopping bag could not be loaded. Please refresh the page."
          );

          return;

        }


        const texture =
          getSelectedTexture();

        const length =
          getSelectedLength();

        const density =
          getSelectedDensity();

        const lace =
          getSelectedLace();

        const quantity =
          getQuantity();


        const capSelect =
          document.getElementById("cap-size");

        const colorSelect =
          document.getElementById("wig-color");


        const cap =
          capSelect
            ? capSelect.value
            : "Medium";

        const color =
          colorSelect
            ? colorSelect.value
            : "Natural Black";


        const mainImage =
          document.getElementById(
            "main-wig-image"
          );


        const item = {

          productId:
            "burmese-wig",

          name:
            "Burmese " +
            texture +
            " Lace Wig",

          texture:
            texture,

          length:
            length + '"',

          density:
            density,

          laceSize:
            lace,

          color:
            color,

          capSize:
            cap,

          quantity:
            quantity,

          price:
            price,

          image:
            mainImage
              ? mainImage.src
              : ""

        };


        window.BBBCart.add(item);


        addButton.textContent =
          "ADDED TO BAG ✓";


        setTimeout(
          function () {

            addButton.textContent =
              "ADD TO BAG";

          },
          1200
        );

      }
    );

  }


  /* =====================================================
     INITIAL PRICE
  ===================================================== */

  updateWigPrice();

});

</script>
