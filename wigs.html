/* =========================================================
   TEXTURE PRICE ADJUSTMENT

   Supplier specialty texture = +$8
   Retail = +$24
========================================================= */

const specialtyTextures =
  new Set([
    "Deep Wave",
    "Curly",
    "Kinky Straight",
    "Kinky Curly"
  ]);

const specialtyTextureRetailAdjustment =
  24;


/* =========================================================
   CURRENT SELECTIONS
========================================================= */

let selectedTexture =
  "Body Wave";

let selectedLength =
  28;

let selectedDensity =
  "210%";

let selectedLace =
  "5x5";

let quantity =
  1;

let imageView =
  "model";


/* =========================================================
   ELEMENTS
========================================================= */

const mainImage =
  document.getElementById(
    "main-wig-image"
  );

const imageSwitch =
  document.getElementById(
    "image-switch"
  );

const imageHint =
  document.getElementById(
    "image-hint"
  );

const productTitle =
  document.getElementById(
    "product-title"
  );

const productDescription =
  document.getElementById(
    "product-description"
  );

const selectionText =
  document.getElementById(
    "selection-text"
  );

const quantityDisplay =
  document.getElementById(
    "quantity"
  );

const capSize =
  document.getElementById(
    "cap-size"
  );

const wigColor =
  document.getElementById(
    "wig-color"
  );

const priceElement =
  document.getElementById(
    "price"
  );

const lightbox =
  document.getElementById(
    "lace-lightbox"
  );

const lightboxImage =
  document.getElementById(
    "lightbox-image"
  );

const lightboxClose =
  document.getElementById(
    "lightbox-close"
  );


/* =========================================================
   MONEY
========================================================= */

function money(value){

  return new Intl.NumberFormat(
    "en-US",
    {
      style:"currency",
      currency:"USD"
    }
  ).format(value);

}


/* =========================================================
   GET SECURE DISPLAY PRICE
========================================================= */

function getWigPrice(){

  let price =
    wigPrices[
      selectedDensity
    ][
      selectedLength
    ][
      selectedLace
    ];


  if(
    specialtyTextures.has(
      selectedTexture
    )
  ){

    price +=
      specialtyTextureRetailAdjustment;

  }


  return price;

}


/* =========================================================
   UPDATE PAGE
========================================================= */

function updateProduct(){

  const texture =
    wigTextures[
      selectedTexture
    ];


  mainImage.src =
    imageView === "model"
      ? texture.model
      : texture.product;


  mainImage.alt =
    "Burmese " +
    selectedTexture +
    " Wig";


  productTitle.textContent =
    "Burmese " +
    selectedTexture +
    " Wig";


  productDescription.textContent =
    texture.description;


  if(
    imageView === "model"
  ){

    imageSwitch.textContent =
      "→";

    imageHint.textContent =
      "See Product";

  }else{

    imageSwitch.textContent =
      "←";

    imageHint.textContent =
      "See Model";

  }


  const price =
    getWigPrice();


  priceElement.textContent =
    money(price);


  selectionText.textContent =
    selectedTexture +
    " • " +
    selectedLength +
    "\" • " +
    selectedDensity +
    " Density • " +
    selectedLace.replace(
      "x",
      "×"
    ) +
    " Lace Size • " +
    capSize.value +
    " Cap • " +
    wigColor.value;

}


/* =========================================================
   MODEL / PRODUCT ARROW
========================================================= */

imageSwitch.addEventListener(
"click",
function(){

  imageView =
    imageView === "model"
      ? "product"
      : "model";

  updateProduct();

}
);


/* =========================================================
   TEXTURE
========================================================= */

document
.querySelectorAll(
  ".texture-btn"
)
.forEach(
function(button){

  button.addEventListener(
    "click",
    function(){

      selectedTexture =
        button.dataset.texture;

      imageView =
        "model";


      document
      .querySelectorAll(
        ".texture-btn"
      )
      .forEach(
      function(item){

        item.classList.remove(
          "active"
        );

      }
      );


      button.classList.add(
        "active"
      );


      updateProduct();

    }
  );

}
);


/* =========================================================
   LENGTH
========================================================= */

document
.querySelectorAll(
  ".length-btn"
)
.forEach(
function(button){

  button.addEventListener(
    "click",
    function(){

      selectedLength =
        Number(
          button.dataset.length
        );


      document
      .querySelectorAll(
        ".length-btn"
      )
      .forEach(
      function(item){

        item.classList.remove(
          "active"
        );

      }
      );


      button.classList.add(
        "active"
      );


      updateProduct();

    }
  );

}
);


/* =========================================================
   DENSITY
========================================================= */

document
.querySelectorAll(
  ".density-btn"
)
.forEach(
function(button){

    "click",
    function(){

      selectedDensity =
        button.dataset.density;


      document
      .querySelectorAll(
        ".density-btn"
      )

      function(item){

          "active"
        );

      }
      );


      button.classList.add(
        "active"
      );


      updateProduct();

    }
  );

}
);


/* =========================================================
   LACE
========================================================= */

document
.querySelectorAll(
  "[data-select-lace]"
)
.forEach(
function(button){

  button.addEventListener(
    "click",
    function(){

      selectedLace =
        button.dataset.selectLace;


      document
      .querySelectorAll(
        ".lace-card"
      )
      .forEach(
      function(card){

        card.classList.remove(
          "active"
        );

      }
      );


      document
      .querySelectorAll(
        "[data-select-lace]"
      )
      .forEach(
      function(item){

        item.textContent =
          "Select " +
          item.dataset.selectLace
          .replace(
            "x",
            "×"
          );

      }
      );


      const selectedCard =
        document.querySelector(
          '[data-lace-card="' +
          selectedLace +
          '"]'
        );


      selectedCard.classList.add(
        "active"
      );


      button.textContent =
        "Selected " +
        selectedLace.replace(
          "x",
          "×"
        );


      updateProduct();

    }
  );

}
);


/* =========================================================
   ENLARGE LACE IMAGE
========================================================= */

document
.querySelectorAll(
  "[data-enlarge]"
)
.forEach(
function(button){

  button.addEventListener(
    "click",
    function(event){

      event.preventDefault();

      event.stopPropagation();


      lightboxImage.src =
        button.dataset.enlarge;


      lightbox.classList.add(
        "open"
      );


      document.body.style.overflow =
        "hidden";

    }
  );

}
);


/* =========================================================
   CLOSE LIGHTBOX
========================================================= */

lightboxClose.addEventListener(
"click",
function(){

  lightbox.classList.remove(
    "open"
  );

  document.body.style.overflow =
    "";

}
);


lightbox.addEventListener(
"click",
function(event){

  if(
    event.target === lightbox
  ){

    lightbox.classList.remove(
      "open"
    );

    document.body.style.overflow =
      "";

  }

}
);


document.addEventListener(
"keydown",
function(event){

  if(
    event.key === "Escape"
  ){

    lightbox.classList.remove(
      "open"
    );

    document.body.style.overflow =
      "";

  }

}
);


/* =========================================================
   CAP + COLOR
========================================================= */

  "change",
  updateProduct
);


wigColor.addEventListener(
  "change",
  updateProduct
);


/* =========================================================
   QUANTITY
========================================================= */

document
.getElementById(
  "qty-minus"
)
.addEventListener(
"click",
function(){

  quantity =
    Math.max(
      1,
      quantity - 1
    );


  quantityDisplay.textContent =
    quantity;

}
);


document
.getElementById(
  "qty-plus"
)
.addEventListener(
"click",
function(){

  quantity =
    Math.min(
      20,
      quantity + 1
    );


  quantityDisplay.textContent =
    quantity;

}
);

   CART COUNT
========================================================= */

  window.BBBCart &&
  typeof window.BBBCart.updateCount ===
  "function"
){

  window.BBBCart.updateCount();

/* =========================================================
   START
========================================================= */
